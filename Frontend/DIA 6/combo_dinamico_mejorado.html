<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <div class="container mx-auto p-6">
        <h1 class="text-2xl font-bold text-center mb-6">Ciudades Españolas</h1>

        <div class="bg-white p-6 rounded-md shadow-md mb-6">
            <label for="sciudades" class="block text-sm font-medium mb-2">Selecciona una ciudad:</label>
            <select id="sciudades" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4">
            </select>
            <button onclick="ver()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-md w-full">
                Ver población
            </button>
        </div>

        <div id="datospoblacion" class="bg-white p-6 rounded-md shadow-md text-center"></div>
    </div>
    <script>
        let ciudades = [
            {
                nombre: "Madrid",
                poblacion: 3266126
            },
            {
                nombre: "Barcelona",
                poblacion: 1636762
            },
            {
                nombre: "Valencia",
                poblacion: 791413
            },
            {
                nombre: "Sevilla",
                poblacion: 684234
            },
            {
                nombre: "Zaragoza",
                poblacion: 675302
            }
        ]

        //FUNCION PARA RELLENAR EL SELECT CON LAS OPCIONES

        function mostrar(){
            let html = ''
            for(let c of ciudades){
                html+= `<option value="${c.poblacion}">${c.nombre}</option>`
            }
            document.getElementById('sciudades').innerHTML = html
        }

        //FUNCION PARA MOSTRAR LOS DATOS DE LA OPCION SELECCIONADA

        function ver(){
            let valor = document.getElementById('sciudades').value
            document.getElementById('datospoblacion').innerHTML = `
            <h2 class="text-xl font-bold">La población de la ciudad seleccionada es de ${valor} habitantes.</h2>
            `
        }
        //AL CARGARSE EL DOM, SE RELLENARÁ EL SELECT CON LAS OPCIONES.
        window.addEventListener('DOMContentLoaded', ()=>{
            mostrar()
        })
    </script>
</body>
</html>
